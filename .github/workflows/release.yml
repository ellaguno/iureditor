name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset`: sufijo con el que se publican los instaladores. GitHub los lista
          # por nombre (orden ASCII): el número deja Windows, macOS y Linux en ese orden.
          - platform: ubuntu-22.04
            args: ''
            asset: 3-linux-x64
          - platform: windows-latest
            args: ''
            asset: 1-windows-x64
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            asset: 2-macos-universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal necesita ambos targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev \
            build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Cuerpo del release = sección del CHANGELOG para este tag (vX.Y.Z).
      # `shell: bash` y `cat`/`awk` funcionan en los tres runners.
      - name: Extraer notas del CHANGELOG
        id: notes
        shell: bash
        run: |
          notes=$(awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## " tag) == 1 { grab = 1; next }
            grab && /^## v/ { exit }
            grab { print }
          ' CHANGELOG.md)
          # Respaldo si el tag no tiene sección en el CHANGELOG.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Ver los assets para descargar la versión de tu plataforma."
          fi
          {
            echo "body<<__NOTES_EOF__"
            echo "$notes"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Sólo compila y empaqueta: la release y los assets (con nombre uniforme) se
      # suben en el paso siguiente, y latest.json lo genera el job `manifest`.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los artefactos del updater (.sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo se activa cuando existen el token (secreto SIGNPATH_API_TOKEN) y los
      # identificadores del proyecto (variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG). Sin ellos se publica
      # sin firmar, como hasta ahora. SignPath recibe el instalador como artefacto
      # de esta ejecución, lo firma con el certificado de SignPath Foundation tras
      # la aprobación manual y lo devuelve; la firma Authenticode cambia los bytes,
      # así que la firma minisign del actualizador (.sig) se rehace después.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.asset }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find src-tauri/target -path '*/release/bundle/*' -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvió $nombre pero no existe en el bundle"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::SignPath no devolvió ningún instalador"
            exit 1
          fi
          echo "$n instaladores firmados"

      - name: Publicar en la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist-release
          # iureditor_<versión>_<orden>-<plataforma>.<ext>; bash 3.2 en macOS: sin globstar ni mapfile.
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \) -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *-setup.exe.sig)  ext="exe.sig" ;;
              *.msi.sig)        ext="msi.sig" ;;
              *.deb.sig)        ext="deb.sig" ;;
              *.rpm.sig)        ext="rpm.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "dist-release/iureditor_${VERSION}_${{ matrix.asset }}.${ext}"
          done
          ls -la dist-release
          printf '%s\n' "$NOTES" > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "iureditor $TAG" --notes-file release-notes.md || true
          gh release upload "$TAG" dist-release/* --clobber

  # Manifiesto del actualizador (latest.json): una entrada por plataforma con la
  # firma de su instalador. macOS es universal: la misma entrada para ambas arquitecturas.
  manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Generar y subir latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p firmas && cd firmas
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' || true
          cd ..
          python3 - <<'PY'
          import json, os, glob, datetime
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          platforms = {}
          for sig in glob.glob("firmas/*.sig"):
              asset = os.path.basename(sig)[:-4]
              entry = {"url": base + asset, "signature": open(sig).read().strip()}
              if asset.endswith(".AppImage"):
                  platforms["linux-x86_64"] = entry
              elif asset.endswith(".exe"):
                  platforms["windows-x86_64"] = entry
              elif asset.endswith(".app.tar.gz"):
                  platforms["darwin-aarch64"] = entry
                  platforms["darwin-x86_64"] = entry
          manifest = {"version": version, "notes": f"iureditor {version}",
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
