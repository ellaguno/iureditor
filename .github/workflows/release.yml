name: Release

on:
  push:
    tags:
      - 'v1.*'
  # A mano (Actions → Release → Run workflow): sólo compila y sube los artefactos de la
  # ejecución (entre ellos los MSIX); no crea release, no firma con SignPath ni genera
  # latest.json. Por omisión sólo Windows, para probar el paquete de Microsoft Store.
  workflow_dispatch:
    inputs:
      plataformas:
        description: 'Plataformas a compilar'
        type: choice
        options: [windows, todas]
        default: windows

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `asset`: sufijo con el que se publican los instaladores. GitHub los lista
        # por nombre (orden ASCII): el número deja Windows, macOS y Linux en ese orden.
        # Lanzado a mano con «windows», sólo la entrada de Windows.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.plataformas == 'windows' && '[{"platform":"windows-latest","args":"","asset":"1-windows-x64"}]' || '[{"platform":"ubuntu-22.04","args":"","asset":"3-linux-x64"},{"platform":"windows-latest","args":"","asset":"1-windows-x64"},{"platform":"macos-latest","args":"--target universal-apple-darwin","asset":"2-macos-universal"}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal necesita ambos targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev \
            build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Cuerpo del release = sección del CHANGELOG para este tag (vX.Y.Z).
      # `shell: bash` y `cat`/`awk` funcionan en los tres runners.
      - name: Extraer notas del CHANGELOG
        id: notes
        shell: bash
        run: |
          notes=$(awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## " tag) == 1 { grab = 1; next }
            grab && /^## v/ { exit }
            grab { print }
          ' CHANGELOG.md)
          # Respaldo si el tag no tiene sección en el CHANGELOG.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Ver los assets para descargar la versión de tu plataforma."
          fi
          {
            echo "body<<__NOTES_EOF__"
            echo "$notes"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # --- Firma Developer ID y notarización (macOS) ---------------------------------
      # Mismos secretos que iuredesk e iureproject: DEVELOPER_ID_P12_BASE64,
      # DEVELOPER_ID_PASSWORD, KEYCHAIN_PASSWORD, APPLE_TEAM_ID y, para notarizar,
      # ASC_KEY_ID, ASC_ISSUER_ID y ASC_PRIVATE_KEY. El certificado va a un keychain
      # temporal (se borra al final) y se exportan las variables que lee el bundler de
      # Tauri: APPLE_SIGNING_IDENTITY (firma el .app con hardened runtime) y APPLE_API_*
      # (notariza y engrapa el .app antes de empaquetar el .dmg y el .app.tar.gz, así
      # que ambos llevan el .app ya engrapado y la firma minisign se calcula después).
      # Sin los secretos sale sin firmar, como hasta ahora.
      - name: Firma de Apple (keychain temporal)
        if: runner.os == 'macOS'
        id: apple
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEVELOPER_ID_P12_BASE64" ] || [ -z "$DEVELOPER_ID_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::warning::Sin DEVELOPER_ID_P12_BASE64/DEVELOPER_ID_PASSWORD/KEYCHAIN_PASSWORD: el .app y el .dmg salen sin firmar."
            exit 0
          fi
          KC="$RUNNER_TEMP/iureditor-firma.keychain-db"
          P12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$P12" -k "$KC" -P "$DEVELOPER_ID_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*(\('"$APPLE_TEAM_ID"'\))\)".*/\1/p' | head -n1)"
          if [ -z "$IDENTITY" ]; then
            security find-identity -v -p codesigning "$KC"
            echo "::error::El .p12 no trae una identidad «Developer ID Application» del equipo $APPLE_TEAM_ID."
            exit 1
          fi
          echo "Identidad: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
            chmod 600 "$KEY"
            { echo "APPLE_API_KEY=$ASC_KEY_ID"; echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"; echo "APPLE_API_KEY_PATH=$KEY"; } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin ASC_KEY_ID/ASC_ISSUER_ID/ASC_PRIVATE_KEY: se firma pero no se notariza (Gatekeeper lo bloqueará)."
          fi

      # Sólo compila y empaqueta: la release y los assets (con nombre uniforme) se
      # suben en el paso siguiente, y latest.json lo genera el job `manifest`.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los artefactos del updater (.sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # --- Paquete MSIX para Microsoft Store (Windows) --------------------------------
      # La Store lo firma: se sube sin firmar (artefacto msix-store, para Partner Center).
      # La identidad sale de Partner Center (Identidad del producto) y va en variables del
      # repo; sin ellas se usan valores de prueba. Lleva lo mismo que instala el NSIS: el
      # .exe (con el frontend embebido) y, si los hubiera, DLL y la carpeta de recursos.
      # Además una copia firmada con un certificado de prueba (msix-prueba, con su .cer)
      # que se instala aquí mismo, se abre y se desinstala, para probar el paquete.
      # Va antes de SignPath: el .exe del paquete es el que compiló tauri-action.
      - name: Paquete MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IureEditor' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          # Primer número +1 y cuarto en 0 (como iureapps e IureProject): 1.19.2 → 2.19.2.0.
          # Siempre crece y la Store exige el último número en 0.
          $appVersion = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $parts = ($appVersion -replace '[-+].*$', '').Split('.')
          $version = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2]).0"
          Write-Output "Versión de la app: $appVersion → versión del paquete: $version"
          # Los valores van dentro de atributos XML.
          $identity = [System.Security.SecurityElement]::Escape($identity)
          $publisher = [System.Security.SecurityElement]::Escape($publisher)
          $display = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          $release = 'src-tauri\target\release'
          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse assets\windows\msix\Assets "$root\Assets"
          Copy-Item "$release\iureditor.exe" "$root\iureditor.exe"
          # Lo demás que el NSIS copiaría junto al .exe (hoy no hay: WebView2Loader va enlazado).
          Get-ChildItem "$release\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $root
          if (Test-Path "$release\resources") { Copy-Item -Recurse "$release\resources" "$root\resources" }
          $manifest = Get-Content assets\windows\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identity).Replace('@PUBLISHER@', $publisher)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $display).Replace('@VERSION@', $version)
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8
          Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Output

          # resources.pri: idiomas del paquete y los iconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX_en-US /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makeappx.exe" pack /d $root /p msix\store\iureditor-windows-x64.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'iureditor (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\iureditor-prueba.cer | Out-Null
          Copy-Item msix\store\iureditor-windows-x64.msix msix\prueba\iureditor-windows-x64-prueba.msix
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba msix\prueba\iureditor-windows-x64-prueba.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba: instalar la copia firmada, abrirla desde el menú Inicio (AUMID), comprobar
          # que corre desde WindowsApps y sigue viva unos segundos, cerrarla y desinstalar.
          Import-Certificate -FilePath msix\prueba\iureditor-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path msix\prueba\iureditor-windows-x64-prueba.msix
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity } | Select-Object -First 1
          if (-not $pkg) { Write-Output "::error::El paquete no quedó instalado"; exit 1 }
          Write-Output "Instalado: $($pkg.PackageFullName) en $($pkg.InstallLocation)"
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!IureEditor"
          $proc = $null
          for ($i = 0; $i -lt 30 -and -not $proc; $i++) {
            Start-Sleep -Seconds 1
            $proc = Get-Process iureditor -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $ok = $false
          if ($proc) {
            Start-Sleep -Seconds 10
            $vivo = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Write-Output "Proceso: $($proc.Id) $($proc.Path) (vivo tras 10 s: $([bool]$vivo))"
            $ok = [bool]$vivo -and ("$($proc.Path)" -like '*\WindowsApps\*')
          } else {
            Write-Output "iureditor no arrancó dentro del paquete"
          }
          Get-Process iureditor -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (-not $ok) { Write-Output "::error::iureditor no se ejecutó correctamente desde el paquete MSIX"; exit 1 }
          Get-ChildItem msix\store, msix\prueba

      - name: Subir el MSIX para la Store
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/store/*

      - name: Subir el MSIX de prueba
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-prueba
          path: msix/prueba/*

      # Comprueba lo que verá Gatekeeper: el .app suelto, el del .dmg y el del
      # .app.tar.gz (lo que instala el actualizador) firmados, notarizados y engrapados.
      - name: Comprobar firma y notarización (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.keychain != ''
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find src-tauri/target -type d -path '*/release/bundle/macos' | head -1)"
          APP="$BUNDLE/iureditor.app"
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            codesign -dv --verbose=2 "$1" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
            if [ "${{ steps.apple.outputs.notarize }}" = true ]; then
              xcrun stapler validate "$1"
              spctl --assess --type execute --verbose=4 "$1"
            fi
          }
          check "$APP"
          DMG="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)"
          MNT="$RUNNER_TEMP/dmg-check"; mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" > /dev/null
          check "$MNT/iureditor.app"
          hdiutil detach "$MNT" > /dev/null
          TGZ="$RUNNER_TEMP/tgz-check"; rm -rf "$TGZ"; mkdir -p "$TGZ"
          tar -xzf "$BUNDLE/iureditor.app.tar.gz" -C "$TGZ"
          check "$TGZ/iureditor.app"

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo se activa cuando existen el token (secreto SIGNPATH_API_TOKEN) y los
      # identificadores del proyecto (variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG). Sin ellos se publica
      # sin firmar, como hasta ahora. SignPath recibe el instalador como artefacto
      # de esta ejecución, lo firma con el certificado de SignPath Foundation tras
      # la aprobación manual y lo devuelve; la firma Authenticode cambia los bytes,
      # así que la firma minisign del actualizador (.sig) se rehace después.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.asset }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find src-tauri/target -path '*/release/bundle/*' -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvió $nombre pero no existe en el bundle"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::SignPath no devolvió ningún instalador"
            exit 1
          fi
          echo "$n instaladores firmados"

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist-release
          # iureditor_<versión>_<orden>-<plataforma>.<ext>; bash 3.2 en macOS: sin globstar ni mapfile.
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \) -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *-setup.exe.sig)  ext="exe.sig" ;;
              *.msi.sig)        ext="msi.sig" ;;
              *.deb.sig)        ext="deb.sig" ;;
              *.rpm.sig)        ext="rpm.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "dist-release/iureditor_${VERSION}_${{ matrix.asset }}.${ext}"
          done
          ls -la dist-release
          printf '%s\n' "$NOTES" > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "iureditor $TAG" --notes-file release-notes.md || true
          gh release upload "$TAG" dist-release/* --clobber

      - name: Borrar el keychain temporal y la clave de App Store Connect
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ steps.apple.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.apple.outputs.keychain }}" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/devid.p12

  # Manifiesto del actualizador (latest.json): una entrada por plataforma con la
  # firma de su instalador. macOS es universal: la misma entrada para ambas arquitecturas.
  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Generar y subir latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p firmas && cd firmas
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' || true
          cd ..
          python3 - <<'PY'
          import json, os, glob, datetime
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          platforms = {}
          for sig in glob.glob("firmas/*.sig"):
              asset = os.path.basename(sig)[:-4]
              entry = {"url": base + asset, "signature": open(sig).read().strip()}
              if asset.endswith(".AppImage"):
                  platforms["linux-x86_64"] = entry
              # Claves por instalador ({os}-{arch}-{tipo}): el actualizador las prefiere a
              # {os}-{arch}, así una instalación .deb/.rpm recibe su propio paquete
              # (con el AppImage falla con «update is not a valid deb package»).
              elif asset.endswith(".deb"):
                  platforms["linux-x86_64-deb"] = entry
              elif asset.endswith(".rpm"):
                  platforms["linux-x86_64-rpm"] = entry
              elif asset.endswith(".exe"):
                  platforms["windows-x86_64"] = entry
              elif asset.endswith(".app.tar.gz"):
                  platforms["darwin-aarch64"] = entry
                  platforms["darwin-x86_64"] = entry
          manifest = {"version": version, "notes": f"iureditor {version}",
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
