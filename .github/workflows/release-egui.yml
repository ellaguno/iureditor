# IureEditor 2.0 (egui) en alfa: con una etiqueta `egui-vX.Y.Z-…` compila Linux, Windows y macOS
# (universal) y deja una Release **borrador y preliminar** con los paquetes (egui/scripts/package.sh).
#
# - No usa etiquetas `v*`: esas son de IureEditor 1.x (Tauri, release.yml).
# - Preliminar: GitHub no la toma como «Latest», así el actualizador de la 1.x (latest.json de la
#   última Release) sigue igual.
# - Convive con la 1.x: binario `iureditor2`, sin el esquema `iureditor://`.
name: Release 2.0 (alfa)

on:
  push:
    tags:
      - 'egui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-latest
          # Intel: a las arm64 de macos-latest a menudo no les toca máquina (como en IureProject);
          # compila las dos arquitecturas igual y el .app es universal.
          - os: macos
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # El kit de interfaz de la suite es una dependencia por ruta (`../iurefficient-ui`, como en
      # IureProject): se baja al lado del repositorio (público).
      - name: Kit de interfaz junto al repositorio
        run: git clone --depth 1 https://github.com/ellaguno/iurefficient-ui ../iurefficient-ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: egui

      - name: Dependencias de Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Versión
        id: v
        run: |
          VERSION=$(grep -m1 '^version' egui/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "egui-v$VERSION" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $VERSION de egui/Cargo.toml" >&2
            exit 1
          fi

      - name: Compilar
        working-directory: egui
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
          else
            cargo build --release
          fi

      - name: Probar que arranca sin ventana
        if: matrix.os != 'macos'
        working-directory: egui
        run: |
          printf '# Prueba\n\n- [x] hecho\n' > prueba.md
          ./target/release/iureditor2 --export prueba.md prueba.html
          grep -q '<h1>Prueba</h1>' prueba.html

      - name: Empaquetar
        run: egui/scripts/package.sh ${{ matrix.os }} ${{ steps.v.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: iureditor2-${{ matrix.os }}
          path: egui/dist/*

  # El borrador sale aunque falle un sistema: con los paquetes que sí se hicieron.
  release:
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Release borrador y preliminar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#egui-v}"
          NOTES="egui/notas/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          (cd paquetes && sha256sum * > SHA256SUMS)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease \
            --title "IureEditor $VERSION (vista previa de la 2.0)" --notes-file "$NOTES"
          gh release upload "$TAG" paquetes/* --clobber
