# IureEditor 2.0 (S1.15 de la suite): ventana egui sobre el editor de documentos de Iurefficient
# (`iure-doc-ui`, el mismo de las notas de IureDesk y de IureProject). Convive con la versión Tauri
# (`src-tauri/`) hasta la paridad; ver `docs/plan-2.0.md`.
[package]
name = "iureditor-egui"
version = "2.0.0-alpha.5"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "IureEditor 2.0: editor de documentos Markdown en Rust + egui"
publish = false

[[bin]]
name = "iureditor2"
path = "src/main.rs"

# Proyecto propio, fuera del de Tauri.
[workspace]

[dependencies]
egui = "0.37"
# `clipboard`: el portapapeles del sistema (sin él, egui solo pega lo copiado dentro de la app);
# `links`: abrir direcciones web (Ayuda, descargas).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "clipboard", "links"] }
# Kit de interfaz de la suite (por ruta, como en IureProject) y editor de documentos (repositorio
# propio, etiqueta fija).
iurefficient-ui = { path = "../../iurefficient-ui" }
iure-doc-ui = { git = "https://github.com/ellaguno/iure-doc", tag = "v0.31.1" }
iure-doc = { git = "https://github.com/ellaguno/iure-doc", tag = "v0.31.1" }
# Exportar a HTML, Word y PDF (S1.14; PDF con Typst, Rust puro).
iure-doc-export = { git = "https://github.com/ellaguno/iure-doc", tag = "v0.31.1", features = ["pdf"] }
# Diagramas exportados como PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
# Borradores de recuperación y MCP (JSON).
serde_json = "1"
# `--mcp` por stdio con el protocolo de la suite (S1.8).
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.9.1", default-features = false }
anyhow = "1"
# Pestaña Iurefficient: la red de `iurefficient-connect` en un hilo con tokio; espejos en JSON.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", default-features = false }
# Ayuda › Buscar actualizaciones (el `latest.json` de GitHub; rustls, el mismo que trae
# iurefficient-connect).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Plantillas: carpeta de datos (la de la versión Tauri) y la fecha local.
dirs = "6"
# Enlaces `iureditor://` y una sola ventana (token del socket local).
url = "2"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Diagramas dibujados en su lugar con el mismo motor que IureDesk (mermaid-svg, mapas mentales,
# Blitz; Rust puro). Fijado a un commit de IureDesk (público).
iuredesk-html-view = { git = "https://github.com/ellaguno/iuredesk", rev = "7b12f6061826678e2caee55ff1bef18ebcb34851" }

# Llavero (la sesión compartida de la suite, como IureDesk): Secret Service por D-Bus con zbus y
# cifrado RustCrypto (Rust puro, sin libdbus); administrador de credenciales en Windows; llavero en
# macOS.
[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

# Diálogos de archivo por el portal XDG (Rust puro, sin GTK).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }

# `iure-doc-ui` pide el kit por git; aquí se usa el de la ruta (una sola copia).
[patch."https://github.com/ellaguno/iurefficient-ui"]
iurefficient-ui = { path = "../../iurefficient-ui" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
