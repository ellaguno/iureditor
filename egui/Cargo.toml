# IureEditor 2.0 (S1.15 de la suite): ventana egui sobre el editor de documentos de Iurefficient
# (`iure-doc-ui`, el mismo de las notas de IureDesk y de IureProject). Convive con la versión Tauri
# (`src-tauri/`) hasta la paridad; ver `docs/plan-2.0.md`.
[package]
name = "iureditor-egui"
version = "2.0.0-alpha.2"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "IureEditor 2.0: editor de documentos Markdown en Rust + egui"
publish = false

[[bin]]
name = "iureditor2"
path = "src/main.rs"

# Proyecto propio, fuera del de Tauri.
[workspace]

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
# Kit de interfaz de la suite (por ruta, como en IureProject) y editor de documentos (repositorio
# propio, etiqueta fija).
iurefficient-ui = { path = "../../iurefficient-ui" }
iure-doc-ui = { git = "https://github.com/ellaguno/iure-doc", tag = "v0.8.0" }
thiserror = "2"
# Diagramas dibujados en su lugar con el mismo motor que IureDesk (mermaid-svg, mapas mentales,
# Blitz; Rust puro). Fijado a un commit de IureDesk (público).
iuredesk-html-view = { git = "https://github.com/ellaguno/iuredesk", rev = "c113e32bec2b40de024cb5036e2083bd52b7cae7" }

# Diálogos de archivo por el portal XDG (Rust puro, sin GTK).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }

# `iure-doc-ui` pide el kit por git; aquí se usa el de la ruta (una sola copia).
[patch."https://github.com/ellaguno/iurefficient-ui"]
iurefficient-ui = { path = "../../iurefficient-ui" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
